<mat-dialog-content style="overflow-x: hidden; padding: 0px;">
    <div class="card" style=" background: #f8fafc; margin-bottom: 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: #374151; font-size: 18px;">Invoice Number - {{ currentRequest.invoiceNumber }}</h3>
            <button class="btn btn-outline" mat-dialog-close style="padding: 8px 12px;">
                <span class="material-icons" style="font-size: 16px;">close</span>
                Close
            </button>
        </div>
        
        <div class="fade-in">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Request Type *</label>
                    <input [(ngModel)]="currentRequest.requestType" class="form-input"
                        placeholder="Request type" readonly />
                </div>
                <div class="form-group">
                    <label class="form-label">Remark *</label>
                    <textarea class="form-input" [(ngModel)]="currentRequest.secondaryApprovalRemark" placeholder="Enter your remark"
                        rows="4" style="font-family: inherit;" readonly></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Customer Name *</label>
                    <input type="text" class="form-input" [(ngModel)]="currentRequest.customerName"
                        placeholder="Enter customer name">
                </div>
                <div class="form-group">
                    <label class="form-label">Customer Email</label>
                    <input type="text" class="form-input" [(ngModel)]="currentRequest.customerEmail"
                        placeholder="Enter customer email">
                </div>
                <div class="form-group">
                    <label class="form-label">Address *</label>
                    <select class="form-select" [(ngModel)]="currentRequest.customerAddress">
                        <option value="" disabled selected>Select address</option>
                        <option *ngFor="let addr of addresses" [value]="addr?.title">
                            {{ addr?.title }}
                        </option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">No. of Packages *</label>
                    <input [(ngModel)]="currentRequest.noOfPackages" class="form-input"
                        placeholder="Enter No. of Packages" />
                </div>
                <div class="form-group">
                    <label class="form-label">Weight *</label>
                    <input [(ngModel)]="currentRequest.weight" class="form-input" placeholder="Enter Weight" />
                </div>
            </div>
            <!-- Dynamic Table -->
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th *ngFor="let column of getTableColumns()" [style.min-width]="getColumnWidth(column)">{{
                                column }}</th>
                            <th style="width: 80px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of currentRequest.items; let i = index">
                            <td>{{ item.srNo }}</td>

                            <!-- Raw Material Columns -->
                            <ng-container *ngIf="selectedRequestType === 'Raw Material'">
                                <!-- <td><input type="text" [(ngModel)]="item.metier" (input)="calculateAmount(i)"
                                        placeholder="Enter métier"></td> -->
                                <td>
                                    <select [(ngModel)]="item.metier" (change)="calculateAmount(i)" style="padding: 8px;
                                    border: 1px solid #d1d5db;
                                    border-radius: 4px;
                                    font-size: 13px; width: 100%;">
                                        <option value="" disabled selected>Select métier</option>
                                        <option *ngFor="let metier of metiers" [value]="metier">{{ metier }}</option>
                                    </select>
                                </td>
                                <!-- <td><input type="text" [(ngModel)]="item.rmCode" (input)="calculateAmount(i)"
                                        placeholder="Enter RM code"></td> -->
                                <!-- <td style="position: relative;">
                                    <input type="text" [(ngModel)]="item.rmCode"
                                        (input)="calculateAmount(i); showDropdown(i)" (focus)="showDropdown(i)"
                                        (blur)="onBlurDropdown()" placeholder="Enter RM code"
                                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px;">

                                    
                                    <ul *ngIf="openDropdownIndex === i && getFilteredRmCodes(item.rmCode || '').length"
                                        style="position: absolute; z-index: 1000; background: white; border: 1px solid #ccc; list-style: none; margin: 0; padding: 0; max-height: 120px; overflow-y: auto;">
                                        <li *ngFor="let code of getFilteredRmCodes(item.rmCode || '')"
                                            (mousedown)="selectRmCode(item, code, i)"
                                            style="padding: 8px; cursor: pointer;">
                                            {{ code }}
                                        </li>
                                    </ul>
                                </td> -->
                                <td style="position: relative;">
                                    <input type="text" [(ngModel)]="item.rmCode"
                                        (input)="calculateAmount(i); showDropdown(i)" (focus)="showDropdown(i)"
                                        (blur)="onBlurDropdown()" placeholder="Search RM code"
                                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px;">
                                    <ul *ngIf="openDropdownIndex === i && getFilteredRmCodes(item.rmCode || '').length"
                                        style="position: absolute; z-index: 1000; background: white; border: 1px solid #ccc; list-style: none; margin: 0; padding: 0; max-height: 120px; width: 85%;overflow-y: auto;">
                                        <li *ngFor="let code of getFilteredRmCodes(item.rmCode || '')"
                                            (mousedown)="selectRmCode(item, code, i)"
                                            style="padding: 8px; cursor: pointer;">
                                            {{ code }}
                                        </li>
                                    </ul>
                                </td>
                                <!-- <td>
                                    <input type="number" [(ngModel)]="item.rate" placeholder="0" min="0" step="0.01" readonly>
                                  </td> -->
                                <td><input type="number" [(ngModel)]="item.quantity" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                                <td><input type="number" [(ngModel)]="item.rate" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                                <td><input type="number" [(ngModel)]="item.noOfPacks" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                            </ng-container>

                            <!-- Packaging Material / Packmat Columns -->
                            <ng-container
                                *ngIf="selectedRequestType === 'Packaging Material' || selectedRequestType === 'Packmat'">
                                <td><input type="text" [(ngModel)]="item.description" (input)="calculateAmount(i)"
                                        placeholder="Enter description"></td>
                                <td style="position: relative;" *ngIf="selectedRequestType === 'Packmat'">
                                    <input type="text" [(ngModel)]="item.code"
                                        (input)="calculateAmount(i); showDropdownForPackmatCode(i)"
                                        (focus)="showDropdownForPackmatCode(i)" (blur)="onBlurDropdownForPackmatCode()"
                                        placeholder="Search packmat code"
                                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px;">
                                    <ul *ngIf="openDropdownIndexForPackmatCode === i && getFilteredPackmatCodes(item.code || '').length"
                                        style="position: absolute; z-index: 1000; background: white; border: 1px solid #ccc; list-style: none; margin: 0; padding: 0; max-height: 120px;width: 85%; overflow-y: auto;">
                                        <li *ngFor="let obj of getFilteredPackmatCodes(item.code || '')"
                                            (mousedown)="selectPackmatCode(item, obj?.code, i)"
                                            style="padding: 8px; cursor: pointer;">
                                            {{ obj.code }} ({{ obj.name }})
                                        </li>
                                    </ul>
                                </td>
                                <td *ngIf="selectedRequestType === 'Packaging Material'"><input type="text"
                                        [(ngModel)]="item.code" (input)="calculateAmount(i)" placeholder="Enter code">
                                </td>
                                <td><input type="text" [(ngModel)]="item.name" (input)="calculateAmount(i)"
                                        placeholder="Enter name"></td>
                                <!-- <td><input type="text" [(ngModel)]="item.contact" (input)="calculateAmount(i)"
                                        placeholder="Enter contact"></td> -->
                                <td><input type="number" [(ngModel)]="item.quantity" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                                <td><input type="number" [(ngModel)]="item.noOfPacks" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                                <td><input type="number" [(ngModel)]="item.rate" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                            </ng-container>

                            <!-- Finished Goods Columns -->
                            <ng-container *ngIf="selectedRequestType === 'Finished Goods'">
                                <td><input type="text" [(ngModel)]="item.description" (input)="calculateAmount(i)"
                                        placeholder="Enter description"></td>
                                <td><input type="text" [(ngModel)]="item.code" (input)="calculateAmount(i)"
                                        placeholder="Enter code"></td>
                                <td><input type="text" [(ngModel)]="item.formulatorName" (input)="calculateAmount(i)"
                                        placeholder="Enter name"></td>
                                <!-- <td><input type="text" [(ngModel)]="item.formulator" (input)="calculateAmount(i)"
                                        placeholder="Enter formulator"></td> -->
                                <td><input type="number" [(ngModel)]="item.quantity" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                                <td><input type="number" [(ngModel)]="item.noOfPacks" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                                <td><input type="number" [(ngModel)]="item.rate" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                            </ng-container>

                            <!-- Bulk Columns -->
                            <ng-container *ngIf="selectedRequestType === 'Bulk'">
                                <td><input type="text" [(ngModel)]="item.description" (input)="calculateAmount(i)"
                                        placeholder="Enter description"></td>
                                <td><input type="text" [(ngModel)]="item.code" (input)="calculateAmount(i)"
                                        placeholder="Enter code"></td>
                                <td><input type="text" [(ngModel)]="item.formulatorName" (input)="calculateAmount(i)"
                                        placeholder="Enter name"></td>
                                <!-- <td><input type="text" [(ngModel)]="item.formulator" (input)="calculateAmount(i)"
                                        placeholder="Enter formulator"></td> -->
                                <td><input type="number" [(ngModel)]="item.quantity" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                                <td><input type="number" [(ngModel)]="item.noOfBuckets" (input)="calculateAmount(i)"
                                        placeholder="0" min="0"></td>
                                <td><input type="number" [(ngModel)]="item.rate" (input)="calculateAmount(i)"
                                        placeholder="0" min="0" step="0.01"></td>
                            </ng-container>

                            <!-- <td style="color: #059669; font-weight: 600;">₹{{ item.amount?.toFixed(2) }}</td> -->
                            <td style="color: #059669; font-weight: 600;">
                                ₹{{ isNumber(item.amount) ? item.amount.toFixed(2) : '0.00' }}
                            </td>
                            <td>
                                <button type="button" class="btn btn-danger" (click)="removeItem(i)"
                                    style="padding: 6px 8px; font-size: 12px;">
                                    <span class="material-icons" style="font-size: 16px;">delete</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Add Row Button -->
            <div class="action-buttons" style="margin-top: 16px;">
                <button type="button" class="btn btn-outline" (click)="addItem()">
                    <span class="material-icons" style="font-size: 16px;">add</span>
                    Add Row
                </button>
            </div>

            <!-- Summary Section -->
            <div class="summary-section" *ngIf="(currentRequest.items ?? []).length > 0">
                <div class="summary-row summary-total">
                    <span>Total Amount:</span>
                    <span>₹{{ getTotalAmount()?.toFixed(2) }}</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="button" mat-dialog-close class="btn btn-secondary">
                    <span class="material-icons" style="font-size: 16px;">close</span>
                    close
                </button>
                <button type="button" class="btn btn-primary" (click)="updateRequest()" [disabled]="!isFormValid()">
                    <span class="material-icons" style="font-size: 16px;">send</span>
                    Update Request
                </button>
            </div>
        </div>
    </div>
</mat-dialog-content>
