<div class="main-class">
    <div class="mat-elevation-z8">
        <div style="padding: 10px 10px;
      border-bottom: 1px solid #dddbdb;
      display: flex
  ;
      align-items: center;
      justify-content: space-between;
  ">
            <mat-form-field style="width: 40%;margin-bottom: -1.25em;">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search by Component Name or Code">
            </mat-form-field>

            <div style="display: flex; column-gap: 10px;">
                <!-- matTooltip=""  -->
                <button mat-raised-button color="primary" (click)="handleAddAction()"
                    *ngIf="currentUserRole === 'Gatepass Admin' || currentUserRole === 'Gatepass User' || currentUserRole === 'Pune DG Admin' || currentUserRole === 'Transport Admin'">
                    <mat-icon>add</mat-icon> Create
                </button>
                <button mat-raised-button color="primary" (click)="handleAddAction()"
                    *ngIf="currentUserRole === 'Gatepass Admin' || currentUserRole === 'Gatepass User' || currentUserRole === 'Pune DG Admin' || currentUserRole === 'Transport Admin'">
                    <mat-icon>swap_vert</mat-icon> Import
                </button>
            </div>

        </div>
        <table mat-table [dataSource]="dataSource" matSort>
            <!-- Position Column -->
            <ng-container matColumnDef="requestType">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Request Type</th>
                <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
                    matTooltip="{{ element?.RequestType }}">
                    {{ element?.RequestType }}
                </td>
            </ng-container>
            <ng-container matColumnDef="invoiceNo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Invoice Number</th>
                <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
                    matTooltip="{{ element?.InvoiceNo }}">
                    {{ element?.InvoiceNo }}
                </td>
            </ng-container>
            <ng-container matColumnDef="customerName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</th>
                <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
                    matTooltip="{{ element?.CustomerName }}">
                    {{ element?.CustomerName || 'N/A'}}
                </td>
            </ng-container>

            <ng-container matColumnDef="createdBy">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Created By</th>
                <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
                    matTooltip="{{ element?.CreatedBy }}">
                    {{ element?.CreatedBy?.Title }}
                </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Request Status</th>
                <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
                    matTooltip="{{ element?.RequestStatus }}">
                    {{ element?.RequestStatus }}
                </td>
            </ng-container>


            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element">

                    <button mat-icon-button color="primary" (click)="handleViewAction(element)">
                        <mat-icon> visibility </mat-icon>
                    </button>
                    <!-- <button mat-icon-button color="primary" (click)="handleEditAction(element)" *ngIf="currentUserRole === 'R&I Admin' || currentUserRole === 'Pune DG Admin'">
                <mat-icon> edit </mat-icon>
              </button> -->
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5,10, 20, 50]" showFirstLastButtons></mat-paginator>
    </div>
</div>
