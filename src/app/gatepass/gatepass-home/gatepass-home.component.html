<div class="app-header">
    <app-header  [title]="'E-Gatepass & Invoice Management'"></app-header>
</div>
<div class="container">
    <!-- Header -->
    <!-- <header style="text-align: center; margin-bottom: 10px; padding: 32px 0;">
        <h1 style="color: #1e293b; font-size: 32px; font-weight: 700; margin-bottom: 8px;">
            E-Gatepass & Invoice Management
        </h1>
        <p style="color: #64748b; font-size: 16px; font-weight: 400;">
            Streamlined request management system for materials and approvals
        </p>
    </header> -->

    <!-- Navigation Tabs -->
    <div class="tabs" style="margin-top: 6em">
        <button class="tab" [class.active]="activeTab === 'my-requests'" (click)="setActiveTab('my-requests')">
            <span class="material-icons" style="font-size: 16px; margin-right: 8px;">assignment</span>
            My Requests
        </button>
        <button class="tab" [class.active]="activeTab === 'requests-for-review'"
            (click)="setActiveTab('requests-for-review')" *ngIf="shouldShowRequestsforReviewTab()">
            <span class="material-icons" style="font-size: 16px; margin-right: 8px;">rate_review</span>
            Requests for Review
        </button>
        <button class="tab" [class.active]="activeTab === 'approval'" (click)="setActiveTab('approval')"
            *ngIf="shouldShowApprovalTab()">
            <span class="material-icons" style="font-size: 16px; margin-right: 8px;">approval</span>
            Approval
        </button>
        <!-- <button class="tab" [class.active]="activeTab === 'approval'" (click)="setActiveTab('approval')"
            *ngIf="shouldShowApprovalTab()">
            <span class="material-icons" style="font-size: 16px; margin-right: 8px;">approval</span>
            Approval
        </button> -->
        <button class="tab" [class.active]="activeTab === 'all-requests'" (click)="setActiveTab('all-requests')"
            *ngIf="shouldShowAllRequestTab()">
            <span class="material-icons" style="font-size: 16px; margin-right: 8px;">all_inbox</span>
            All Requests
        </button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
        <app-my-requests *ngIf="activeTab === 'my-requests'"></app-my-requests>
        <app-requests-for-review *ngIf="activeTab === 'requests-for-review'"></app-requests-for-review>
        <app-approval *ngIf="activeTab === 'approval'"></app-approval>
        <app-all-requests *ngIf="activeTab === 'all-requests'"></app-all-requests>
    </div>

    <!-- Footer -->
    <!-- <footer style="text-align: center; margin-top: 60px; padding: 24px 0; color: #64748b; font-size: 14px;">
        <p>© 2024 E-Gatepass & Invoice Management System.</p>
    </footer> -->
</div>
