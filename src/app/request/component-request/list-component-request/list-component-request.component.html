<div class="main-class">

    <div class="mat-elevation-z8">
        <div style="padding: 10px 10px;
    border-bottom: 1px solid #dddbdb;
    display: flex
;
    align-items: center;
    justify-content: space-between;
">
            <mat-form-field style="width: 40%;margin-bottom: -1.25em;">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search by Component Name or Code">
            </mat-form-field>
        </div>

        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Name</th>
                <td mat-cell *matCellDef="let row" matTooltip="{{ row.name }}">
                    <ng-container>
                        {{ row.name }}
                    </ng-container>
                </td>
            </ng-container>

            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Code</th>
                <td mat-cell *matCellDef="let row" matTooltip="{{ row.code }}">
                    <ng-container>
                        {{ row.code }}
                    </ng-container>
                </td>
            </ng-container>

           
            <ng-container matColumnDef="requestedQuantity">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Requested Quantity</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.requestedQuantity }}
                    </ng-container>
                </td>
            </ng-container>
            <!-- <ng-container matColumnDef="requestedBy">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Requested By</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.requestedBy }}
                    </ng-container>
                </td>
            </ng-container> -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let row">
                    <!-- <ng-container>
                        {{ row.status }}
                    </ng-container> -->
                    <mat-chip [ngClass]="getStatusClass(row.status)">{{getStatusText(row.status)}}</mat-chip>
                </td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let row">

                    <button mat-icon-button color="primary" matTooltip="View" (click)="handleView(row)">
                        <mat-icon> visibility </mat-icon>
                    </button>
                    <button mat-icon-button color="primary" (click)="handleProcessRequest(row)"
                        matTooltip="Process Request" *ngIf="isAdmin"
                        [disabled]="shouldDisableProcessRequestIcon(row.status)">
                        <mat-icon> check </mat-icon>
                    </button>
                </td>
            </ng-container>



            <!-- Table rows -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <button mat-fab color="primary" class="fab-button" color="primary" (click)="handleAddAction()"
            matTooltip="New Component Request">
            <mat-icon>add</mat-icon>
        </button>
        <mat-paginator [pageSizeOptions]="[5,10, 20, 50]" showFirstLastButtons></mat-paginator>
    </div>
</div>
