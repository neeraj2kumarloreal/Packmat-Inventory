<div class="main-class">
    <div class="mat-elevation-z8">
        <div style="padding: 10px 10px;
        border-bottom: 1px solid #dddbdb;
        display: flex
    ;
        align-items: center;
        justify-content: space-between;
    ">
            <mat-form-field style="width: 40%;margin-bottom: -1.25em;">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search by Component Name or Code">
            </mat-form-field>
            
        </div>
    
        <table mat-table [dataSource]="dataSource" matSort>
    
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Name</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.name }}
                    </ng-container>
                </td>
            </ng-container>
    
            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Code</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.code }}
                    </ng-container>
                </td>
            </ng-container>
           
            <ng-container matColumnDef="forecastQuantity">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Forecast Quantity</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.forecastQuantity }}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="requestedQuantity">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Requested Quantity</th>
                    <td mat-cell *matCellDef="let row">
                        <ng-container>
                            {{ row.requestedQuantity }}
                        </ng-container>
                    </td>
                </ng-container>
            <ng-container matColumnDef="availableQuantity">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Available Quantity</th>
                <td mat-cell *matCellDef="let row">
                    <ng-container>
                        {{ row.availableQuantity }}
                    </ng-container>
                </td>
            </ng-container>
          
            <!-- Table rows -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <button mat-fab color="primary" class="fab-button" color="primary" (click)="downloadXlsxFile()" matTooltip="Download XLSX">
        <mat-icon>description</mat-icon>
      </button>
        <mat-paginator [pageSizeOptions]="[5,10, 20, 50]" showFirstLastButtons></mat-paginator>
    </div>
    </div>
