<div class="main-class">
  <div class="mat-elevation-z8">
    <div style="padding: 10px 10px;
    border-bottom: 1px solid #dddbdb;
    display: flex
;
    align-items: center;
    justify-content: space-between;
">
        <mat-form-field style="width: 40%;margin-bottom: -1.25em;">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search by Component Name or Code">
        </mat-form-field>
      
    </div>
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Position Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Name</th>
        <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'" matTooltip="{{ element?.ProductName }}">
          {{ element?.ProductName }}
        </td>
      </ng-container>
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Component Code</th>
        <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'" matTooltip="{{ element?.Code }}">
          {{ element?.Code }}
        </td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'"
          matTooltip="{{ element?.Category }}">
          {{ element?.Category }}
        </td>
      </ng-container>
      <!-- <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'" matTooltip="{{ element?.Type?.$DI_1 }}">
          {{ element?.Type?.$DI_1 }}
        </td>
      </ng-container> -->
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Available Quantity</th>
        <td mat-cell *matCellDef="let element" [matTooltipPosition]="'above'" matTooltip="{{ element?.Quantity }}">
          {{ element?.Quantity || 0 }}
        </td>
      </ng-container>
      <!-- <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Component Image</th>
        <td mat-cell *matCellDef="let element">

          <img [src]="element?.Image" alt="Product Image" class="product-img" />
        </td>
      </ng-container> -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Component Image</th>
        <td mat-cell *matCellDef="let element">
            <div class="image-container" #imageContainer> 
                <img [src]="element.Image" alt="Product Image" class="product-img">
                <img [src]="element.largeImage || element.Image" alt="Enlarged Product Image" class="large-image"> 
            </div>
        </td>
    </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">

          <button mat-icon-button color="primary" (click)="handleViewAction(element)">
            <mat-icon> visibility </mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="handleEditAction(element)" *ngIf="currentUserRole === 'R&I Admin' || currentUserRole === 'Pune DG Admin'">
              <mat-icon> edit </mat-icon>
            </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <button mat-fab color="primary" class="fab-button" color="primary" (click)="handleAddAction()"
      *ngIf="currentUserRole === 'R&I Admin' || currentUserRole === 'Pune DG Admin'">
      <mat-icon>add</mat-icon>
    </button>
    <mat-paginator [pageSizeOptions]="[5,10, 20, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>
