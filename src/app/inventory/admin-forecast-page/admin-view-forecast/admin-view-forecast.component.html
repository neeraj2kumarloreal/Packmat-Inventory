<div class="main-class">
    <h1 class="main-header">Forecast Details</h1>
    <form [formGroup]="forecastForm">
        <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px" fxLayoutAlign="start stretch">
            <!-- Left Column: Autocomplete, Name, and Available Quantity -->
            <div fxFlex="50" fxLayout="column" fxLayoutGap="16px">
                <mat-form-field appearance="outline">
                    <mat-label>PMCode</mat-label>
                    <input matInput formControlName="pmCode" placeholder="PMCode" readonly />

                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" placeholder="Name" readonly />

                </mat-form-field>

                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Forecast Quantity</mat-label>
                    <input matInput formControlName="forecastQuantity" placeholder="Enter Forecast Quantity"
                        type="number" readonly />

                </mat-form-field>
            </div>

            <!-- Right Column: Product Image -->
            <div fxFlex="50" fxLayout="column" fxLayoutAlign="start center">
                <h4>Product Image</h4>
                <img [src]="imageURL" alt="Product Image" style="max-width: 100%; height: 200px;" />
            </div>
        </div>
    </form>
    <h1>Summary</h1>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Position Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name </th>
            <td mat-cell *matCellDef="let element"> {{element?.createdBy}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="forecastQuantity">
            <th mat-header-cell *matHeaderCellDef> Forecast Quantity </th>
            <td mat-cell *matCellDef="let element"> {{element.forecastQuantity}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="created">
            <th mat-header-cell *matHeaderCellDef> Forecast Date </th>
            <td mat-cell *matCellDef="let element"> {{element.createdDate | date:'dd/MM/yyyy'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="3" class="no-data">No data available.</td>
        </tr>
    </table>

    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px" fxLayoutAlign="center center"
        style="margin-top:40px">

        <button mat-raised-button color="primary" matTooltip="Back" [routerLink]="['/packmat/forecast-overview']"
            aria-label="Example icon button with a menu icon">
            <mat-icon>arrow_back</mat-icon> Back
        </button>

    </div>
</div>
